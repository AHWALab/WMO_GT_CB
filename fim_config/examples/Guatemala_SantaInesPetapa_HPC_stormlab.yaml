# VALIDATED HPC HINDCAST CONFIG: Guatemala Santa Ines Petapa, StormLab 50
# member tree, 20 to 22 June 2023 (49 cycles). This is the exact layout the
# v0.4 results were produced with. For the operational orchestrator tree use
# fim_config/Guatemala_SantaInesPetapa.yaml instead.
# Depth thresholds are a USER INPUT: edit thresholds_m and rerun.
# The store ships with the repo as fim_store/fim_store_SantaInesPetapa_v1.zarr.zip
# and must be unzipped once into fim_store/fim_store_SantaInesPetapa_v1.zarr.
# Pluvial index: REAL RainyDay storm totals (AOC mean, Aug 2026).
# Fluvial index: REAL max boundary discharges (flood_library.mat).
region: Guatemala_SantaInesPetapa_PF

outputs_root: outputs/guatemala_90m_runs   # point at the ensemble tree to process
cycle_format: "%Y%m%d.%H%M%S"

aoc_geojson: fim_config/aoc/Guatemala_SantaInesPetapa_aoc.geojson
store: fim_store/fim_store_SantaInesPetapa_v1.zarr
products_root: outputs/guatemala_90m_runs/fim_pf

member:
  template: "stormlab/ensOut{ens}_sl{sl}/guatemala_90m/tmp_output_crest_stormlab"

trigger:
  threshold: 1.0
  sources:
    - template: "stream_sat/ensOut{ens}/guatemala_90m/tmp_output_crest_streamsat"
    - template: "stormlab/ensOut{ens}_sl{sl}/guatemala_90m/tmp_output_crest_stormlab"
    - template: "guatemala_90m/tmp_output_crest_warmup"

hazards:
  pluvial:
    enabled: true
    grid: qpe_accum
    band: [0.9, 1.2]
    band_wide: [0.8, 1.3]
  fluvial:
    enabled: true
    stat: max
    method: standardized
    boundary_series:
      - "ts.cuenca_villalobos_1.crest.{cycle}.csv"
      - "ts.cuenca_villalobos_2.crest.{cycle}.csv"

# USER INPUT: depth thresholds in meters, any number of values.
thresholds_m: [0.10, 0.30, 0.50, 1.00]

# Overbank variants mask pixels already wet in a near zero inflow reference
# scenario, so products read as hazard beyond the permanent channel.
overbank:
  enabled: true
  reference_scenario: sample_0002

sampling:
  expand_steps_km: [0, 2, 5, 10, 15]
  min_valid_cells: 50

likelihood_bands:
  very_low: [0.0, 0.2]
  low: [0.2, 0.4]
  medium: [0.4, 0.6]
  high: [0.6, 1.01]
