# TITO ops environment (STREAM-Sat + StormLab + EF5 orchestration)
# No PyTorch / CUDA — ConvLSTM nowcast path removed from Guatemala training.
name: tito_env2
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - numpy
  - scipy
  - pandas
  - xarray
  - netcdf4
  - h5py
  - gdal
  - libgdal-netcdf
  - rasterio
  - rioxarray
  - pyproj
  - shapely
  - proj
  - pysteps
  - tqdm
  - pyyaml
  - requests
  - beautifulsoup4
  - boto3
  - botocore
  - cfgrib
  - eccodes
  - python-eccodes
  - herbie-data
  - psutil
  - matplotlib-base
  - pillow
  - tifffile
  - pip:
      - affine
      - click
      - python-dateutil
      - pytz
