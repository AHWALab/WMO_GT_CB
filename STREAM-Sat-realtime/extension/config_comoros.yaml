# Real-time STREAM-Sat QPE — Comoros configuration
# ===================================================
# Author:   Yagmur Derin, University of Iowa
# Created:  2026-04-17
# License:  MIT (see extension/LICENSE)
#
# Domain: Comoros archipelago / SW Indian Ocean (CSGD grid: 90 lat × 110 lon)

# writes ONE NetCDF per half-hourly timestep
output_dir: extension/realtime/output

# Path to the directory containing STREAM_NoiseGeneration.py and
# STREAM_PrecipSimulation.py. Leave blank to auto-detect (the repository
# root, where the upstream master files live).
streamsat_dir: ""

# REQUIRED: path to a CSGD parameter NetCDF trained on the Comoros grid.
# This file is NOT shipped with the repository
csgd_params: "comoros.csgdNLWAR_DPR.nc"

# Ensemble size (STREAM-Sat noise realizations).
ensemble_size: 50

# How many hours of IMERG Early to condition on (this is the operational
# window — the time range that ends up in the output NetCDF).
window_hours: 48

# How many additional hours of IMERG/GFS to ingest BEFORE the operational
# window so the AR(1) noise chain has time to reach steady state.
warmup_hours: 12

# Expected IMERG Early latency in hours;
imerg_latency_hours: 4

region: comoros

# Where to save / load cross-run noise state. Leave blank to disable
# state persistence entirely (each run is fully independent).
state_dir: extension/realtime/state # cross-run continuity ON
state_save_hours: 6
state_max_age_hours: 6

# STREAM-Sat target (IMERG) grid. Matches the Comoros CSGD grid:
# latitude  : 90 cells, -17.95 .. -9.05, dlat = -0.1
# longitude : 110 cells, 41.05 .. 51.95, dlon = +0.1
domain:
  lat_min: -17.95
  lat_max: -9.05
  lon_min: 41.05
  lon_max: 51.95

# GFS download domain — extends a few degrees beyond the STREAM-Sat
# domain so the bilinear interpolation has a buffer on every side.
gfs_domain:
  lat_min: -22.0
  lat_max: -5.0
  lon_min: 37.0
  lon_max: 55.0

# Optional: shared archive for GFS 850 hPa wind NetCDFs.
# When set, run_pipeline checks this folder for pre-downloaded per-hour
# gfs_wind.*.nc files before attempting any network download.
# Populate with: python tito_utils/qpf_utils/gfs_wind_downloader.py --auto-out <path>
gfs_wind_archive_path: "/Dedicated/Humberto/Naman/TITO_Caribbean_Comoros_VM/TITOCaribbeanAndComoros/precip/gfs_winds"

imerg_source: "pps" # switch to PPS (default already)
imerg_pps_email: "vrobledodelgado@uiowa.edu" # same email as in Caribbean_Comoros_config.py
